{% extends 'base.html' %}

{% block content %}

<h3>❤️ My Wishlist</h3>

<div class="container-fluid">
  <div class="row">

    {% for product in products %}
    <div class="col-md-3 mb-4">

      <div class="card h-100">

        <img src="{{ url_for('static', filename=product.image) }}" class="card-img-top">
        
        <div class="card-body text-center">
          <h6>{{ product.name }}</h6>
          <p>₹{{ product.price }}</p>

          <a href="/add_to_cart/{{ product.id }}" class="btn btn-danger w-100">
            Add to Cart
          </a>
          <a href="/remove_wishlist/{{ product.id }}" class="btn btn-outline-danger w-100 mt-2">
  Remove ❌
</a>
        </div>

      </div>

    </div>
    {% endfor %}

  </div>
</div>

{% endblock %}
