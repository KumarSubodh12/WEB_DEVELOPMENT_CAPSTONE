{% extends 'base.html' %}

{% block content %}

<h3>Your Cart 🛒</h3>

<div class="row">
  {% for product in products %}
  <div class="col-md-3 mb-3">
    <div class="card">

      <img src="{{ product.image }}" class="card-img-top">

      <div class="card-body">
        <h6>{{ product.name }}</h6>
        <p>₹{{ product.price }}</p>
      </div>

    </div>
  </div>
  {% endfor %}
</div>
<div class="mt-4 d-flex justify-content-between align-items-center">
  <h5>Total Items: {{ products|length }}</h5>

  <a href="/checkout" class="btn btn-success px-4">
    Checkout 🛍️
  </a>
</div>
<!-- ✅ YAHAN DALNA HAI BUTTON -->
<div class="mt-4">
  <a href="/checkout" class="btn btn-success">
    Proceed to Checkout
  </a>
</div>

{% endblock %}
