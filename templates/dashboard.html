{% extends 'base.html' %}

{% block content %}

<!-- HERO -->
<div class="p-4 mb-4 text-white" style="background: linear-gradient(90deg,#ff3f6c,#ff9068); border-radius:10px;">
  <h3>🔥 Mega Fashion Sale</h3>
  <p>Up to 70% OFF | Limited Time</p>
</div>

<!-- 🔥 IMPORTANT: container add -->
<div class="container-fluid">

  <div class="row g-4">

    {% for product in products %}
    <div class="col-lg-3 col-md-4 col-sm-6">

      <div class="card shadow-sm h-100">

        <!-- 🔥 IMAGE FIX -->
        <img src="{{ url_for('static', filename=product.image.split('static/')[-1]) }}" class="card-img-top">

        <div class="card-body d-flex flex-column justify-content-between">

          <div>
            <h6>{{ product.name }}</h6>
            <p class="fw-bold">₹{{ product.price }}</p>
          </div>

          <div>
            <a href="/add_to_cart/{{ product.id }}" class="btn btn-danger w-100">
              Add to Bag
            </a>

            <a href="/wishlist/{{ product.id }}" class="btn btn-outline-dark w-100 mt-2">
  ❤️ Wishlist
</a>
          </div>

        </div>

      </div>

    </div>
    {% endfor %}

  </div>

</div>

{% endblock %}
